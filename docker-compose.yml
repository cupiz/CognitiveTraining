services:
  postgres:
    image: postgres:16-alpine
    container_name: cog-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cog
      POSTGRES_PASSWORD: cogdev
      POSTGRES_DB: cognitive_training
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cog -d cognitive_training"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
